name: One-time Tailwind lock refresh

on:
  push:
    branches:
      - chore/adopt-master-release-2026-10-04
    paths:
      - .github/workflows/refresh-tailwind-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/adopt-master-release-2026-10-04
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Generate lockfile from package manifest
        run: npm install --package-lock-only

      - name: Verify dependency audit
        run: npm audit --audit-level=moderate

      - name: Commit generated lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-tailwind-lock-once.yml
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for Tailwind 4"
          git push origin HEAD:chore/adopt-master-release-2026-10-04
