name: One-time lockfile security refresh

on:
  push:
    branches:
      - chore/expand-nocodebackend-env-contract
    paths:
      - .github/workflows/refresh-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: chore/expand-nocodebackend-env-contract
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile with npm audit fix
        run: npm audit fix --package-lock-only
      - name: Commit generated lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-lock-once.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh lockfile security fixes"
          git push origin HEAD:chore/expand-nocodebackend-env-contract
