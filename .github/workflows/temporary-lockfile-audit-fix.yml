name: Temporary lockfile audit repair

on:
  push:
    branches:
      - fix/auth-session-error-focus-recovery
    paths:
      - .github/workflows/temporary-lockfile-audit-fix.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/auth-session-error-focus-recovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate audited lockfile
        run: npm audit fix --package-lock-only
      - name: Verify scoped lockfile change
        run: |
          git diff --exit-code -- package.json
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for js-yaml advisory"
          git push origin HEAD:fix/auth-session-error-focus-recovery
