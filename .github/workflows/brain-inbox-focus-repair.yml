name: Brain Inbox focus repair

on:
  push:
    branches:
      - fix/brain-inbox-focus-continuity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/brain-inbox-focus-continuity
      - name: Apply focused repair
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('src/components/inbox/BrainInbox.jsx')
          source = component.read_text()
          old = "      setItems(prev => prev.filter(item => item.id !== id))\n"
          new = old + "      inputRef.current?.focus()\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one delete-state update, found {source.count(old)}')
          component.write_text(source.replace(old, new, 1))

          test_file = Path('test/brain-inbox-capture-list-semantics.test.mjs')
          tests = test_file.read_text()
          marker = "test('deleting a captured thought returns focus to the persistent capture input'"
          if marker not in tests:
              addition = (
                  "\n\ntest('deleting a captured thought returns focus to the persistent capture input', async () => {\n"
                  "  const source = await read('src/components/inbox/BrainInbox.jsx')\n\n"
                  "  assert.match(source, /const inputRef = useRef\\(null\\)/)\n"
                  "  assert.match(source, /ref=\\{inputRef\\}/)\n"
                  "  assert.match(source, /const handleDeleteItem = async \\(id\\) => \\{[\\s\\S]*?setItems\\(prev => prev\\.filter\\(item => item\\.id !== id\\)\\)\\s*inputRef\\.current\\?\\.focus\\(\\)/)\n"
                  "  assert.match(source, /onClick=\\{\\(\\) => handleDeleteItem\\(item\\.id\\)\\}/)\n"
                  "})\n"
              )
              test_file.write_text(tests.rstrip() + addition)
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/brain-inbox-focus-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/inbox/BrainInbox.jsx test/brain-inbox-capture-list-semantics.test.mjs .github/workflows/brain-inbox-focus-repair.yml
          git commit -m "fix: restore capture focus after inbox deletion"
          git push origin HEAD:fix/brain-inbox-focus-continuity
