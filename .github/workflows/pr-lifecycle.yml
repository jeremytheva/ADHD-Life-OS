name: PR lifecycle

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["Application validation"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile PR lifecycle
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Reconcile lifecycle state
        shell: bash
        run: |
          set -euo pipefail

          ensure_label() {
            local label="$1"
            local color="$2"
            gh api --method POST "repos/$REPO/labels"               -f name="$label" -f color="$color" >/dev/null 2>&1 || true
          }

          has_label() {
            gh api "repos/$REPO/issues/$pr_number/labels" --jq '.[].name' | grep -Fxq "$1"
          }

          add_label() {
            gh api --method POST "repos/$REPO/issues/$pr_number/labels" -f "labels[]=$1" >/dev/null
          }

          remove_label() {
            gh api --method DELETE "repos/$REPO/issues/$pr_number/labels/$1" >/dev/null 2>&1 || true
          }

          set_state() {
            local target="$1"
            for label in state:implementing state:validating state:ready state:mergeable state:merged; do
              remove_label "$label"
            done
            add_label "$target"
          }

          clear_blockers() {
            for label in blocked:review blocked:merge-conflict blocked:base-update; do
              remove_label "$label"
            done
          }

          for spec in             'state:implementing 8a2be2'             'state:validating fbca04'             'state:ready 0969da'             'state:mergeable 1d76db'             'state:merged 0e8a16'             'lifecycle:implementation-complete 5319e7'             'lifecycle:validation-complete 0e8a16'             'blocked:review d93f0b'             'blocked:merge-conflict b60205'             'blocked:base-update d876e3'; do
            ensure_label $spec
          done

          pr_number="$EVENT_PR_NUMBER"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            pr_number=$(gh api "repos/$REPO/commits/$WORKFLOW_HEAD_SHA/pulls"               --jq 'map(select(.state == "open" and .base.ref == "main")) | .[0].number // empty')
            [[ -n "$pr_number" ]] || exit 0
          fi

          pr_json=$(gh api "repos/$REPO/pulls/$pr_number")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          is_draft=$(jq -r '.draft' <<<"$pr_json")
          state=$(jq -r '.state' <<<"$pr_json")
          pr_id=$(jq -r '.node_id' <<<"$pr_json")

          [[ "$state" == "open" ]] || exit 0

          if [[ "$EVENT_NAME" == "workflow_run" && "$head_sha" != "$WORKFLOW_HEAD_SHA" ]]; then
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            case "$EVENT_ACTION" in
              opened|reopened)
                clear_blockers
                set_state state:implementing
                ;;
              synchronize)
                remove_label lifecycle:implementation-complete
                remove_label lifecycle:validation-complete
                clear_blockers
                set_state state:implementing
                exit 0
                ;;
              converted_to_draft)
                set_state state:implementing
                exit 0
                ;;
            esac
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_CONCLUSION" == "success" ]]; then
              add_label lifecycle:validation-complete
            elif ! has_label lifecycle:validation-complete; then
              set_state state:validating
              exit 0
            fi
          fi

          if ! has_label lifecycle:implementation-complete; then
            set_state state:implementing
            exit 0
          fi

          if ! has_label lifecycle:validation-complete; then
            set_state state:validating
            exit 0
          fi

          pr_json=$(gh api "repos/$REPO/pulls/$pr_number")
          pr_id=$(jq -r '.node_id' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          is_draft=$(jq -r '.draft' <<<"$pr_json")

          if [[ "$is_draft" == "true" ]]; then
            gh api graphql               -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}'               -F id="$pr_id" >/dev/null
          fi

          clear_blockers
          set_state state:ready

          gh api --method POST "repos/$REPO/dispatches" --input - >/dev/null <<JSON
          {
            "event_type": "pr-lifecycle-ready",
            "client_payload": {
              "pr_number": $pr_number,
              "head_sha": "$head_sha"
            }
          }
          JSON
