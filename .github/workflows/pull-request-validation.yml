name: Application validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate non-breaking dependency remediation
        run: npm audit fix --package-lock-only || true

      - name: Persist generated lockfile on remediation branch
        if: github.event_name == 'pull_request' && github.head_ref == 'implementation/dependency-audit-remediation'
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: apply non-breaking dependency fixes'
          git push origin HEAD:${{ github.head_ref }}

      - name: Report remaining dependency audit details
        run: npm audit --audit-level=moderate || true

      - name: Run canonical validation
        run: npm run validate
