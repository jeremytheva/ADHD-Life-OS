name: Application validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preview Vite 8 migration
        run: |
          npm install --save-dev --package-lock-only --ignore-scripts vite@8.2.2 @vitejs/plugin-react@latest
          git diff -- package.json package-lock.json

      - name: Install migrated dependency tree
        run: npm ci

      - name: Audit migrated dependency tree
        run: npm audit --audit-level=moderate

      - name: Run canonical validation
        run: npm run validate
