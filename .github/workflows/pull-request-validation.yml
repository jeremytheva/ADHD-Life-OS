name: Application validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out E2E branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate Playwright dependency lockfile
        run: npm install --save-dev --package-lock-only --ignore-scripts @playwright/test@latest

      - name: Persist generated Playwright dependency
        if: github.event_name == 'pull_request' && github.head_ref == 'implementation/critical-path-e2e-v2'
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: add Playwright browser dependency'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency tree
        run: npm audit --audit-level=moderate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical validation
        run: npm run validate

      - name: Run critical-path browser tests
        run: npm run test:e2e
