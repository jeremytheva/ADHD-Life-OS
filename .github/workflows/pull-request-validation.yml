name: Application validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Normalize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist normalized lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'implementation/dependency-audit-remediation'
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: normalize lockfile after uuid removal'
          git push origin HEAD:${{ github.head_ref }}

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency audit details
        run: npm audit --audit-level=moderate || true

      - name: Run canonical validation
        run: npm run validate
