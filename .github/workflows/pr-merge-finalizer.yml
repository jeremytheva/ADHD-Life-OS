name: PR merge finalizer

on:
  repository_dispatch:
    types: [pr-lifecycle-ready]

permissions: {}

concurrency:
  group: pr-merge-finalizer-${{ github.event.client_payload.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Re-check exact-head merge gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      pr_id: ${{ steps.gate.outputs.pr_id }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      EVENT_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
    steps:
      - id: gate
        name: Verify repository acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"

          owner="${REPO%%/*}"
          name="${REPO#*/}"
          pr_number="$EVENT_PR_NUMBER"
          [[ -n "$pr_number" ]] || exit 0

          pr_json=$(gh api "repos/$REPO/pulls/$pr_number")
          state=$(jq -r '.state' <<<"$pr_json")
          merged=$(jq -r '.merged' <<<"$pr_json")
          is_draft=$(jq -r '.draft' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          base_sha=$(jq -r '.base.sha' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          pr_id=$(jq -r '.node_id' <<<"$pr_json")

          [[ "$state" == "open" && "$merged" == "false" && "$is_draft" == "false" && "$base_ref" == "main" ]] || exit 0
          [[ -z "$EVENT_HEAD_SHA" || "$head_sha" == "$EVENT_HEAD_SHA" ]] || exit 0

          details=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id state isDraft headRefOid mergeable reviewDecision labels(first:100){nodes{name}} reviewThreads(first:100){nodes{isResolved} pageInfo{hasNextPage}}}}}' \
            -F owner="$owner" -F name="$name" -F number="$pr_number")

          current_head=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$details")
          review_decision=$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"$details")
          unresolved=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$details")
          more_threads=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$details")
          labels=$(jq -r '.data.repository.pullRequest.labels.nodes[].name' <<<"$details")

          [[ "$current_head" == "$head_sha" ]] || exit 0
          grep -Fxq lifecycle:implementation-complete <<<"$labels" || exit 0
          grep -Fxq lifecycle:validation-complete <<<"$labels" || exit 0

          if [[ "$review_decision" == "CHANGES_REQUESTED" || "$review_decision" == "REVIEW_REQUIRED" || "$unresolved" -gt 0 || "$more_threads" == "true" ]]; then
            exit 0
          fi

          behind_by=$(gh api "repos/$REPO/compare/main...$head_sha" --jq '.behind_by')
          [[ "$behind_by" -eq 0 ]] || exit 0

          latest_base_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$latest_base_sha" == "$base_sha" ]] || exit 0

          mergeable="UNKNOWN"
          for attempt in 1 2 3 4 5 6; do
            details=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid mergeable}}}' \
              -F owner="$owner" -F name="$name" -F number="$pr_number")
            current_head=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$details")
            mergeable=$(jq -r '.data.repository.pullRequest.mergeable' <<<"$details")
            [[ "$current_head" == "$head_sha" ]] || exit 0
            [[ "$mergeable" != "UNKNOWN" ]] && break
            sleep 5
          done
          [[ "$mergeable" == "MERGEABLE" ]] || exit 0

          echo "pr_id=$pr_id" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  mark-mergeable:
    name: Record mergeable metadata best-effort
    needs: [gate]
    if: needs.gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    steps:
      - name: Add replacement state before clearing older labels
        shell: bash
        run: |
          set -u -o pipefail
          if gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=state:mergeable" >/dev/null 2>&1; then
            for label in state:implementing state:validating state:ready state:merged; do
              gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$label" >/dev/null 2>&1 || true
            done
          else
            echo "::warning::Could not record state:mergeable; metadata is advisory and merge acceptance is unchanged."
          fi

  merge:
    name: Merge exact approved head
    needs: [gate, mark-mergeable]
    if: needs.gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_ID: ${{ needs.gate.outputs.pr_id }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
    steps:
      - name: Re-read head and merge with expectedHeadOid
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          [[ "$current_head" == "$HEAD_SHA" ]]
          gh api graphql \
            -f query='mutation($id:ID!,$head:GitObjectID!){mergePullRequest(input:{pullRequestId:$id,expectedHeadOid:$head,mergeMethod:MERGE}){pullRequest{merged state}}}' \
            -F id="$PR_ID" -F head="$HEAD_SHA" >/dev/null

  mark-merged:
    name: Record merged metadata best-effort
    needs: [gate, merge]
    if: needs.merge.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    steps:
      - name: Record terminal metadata
        shell: bash
        run: |
          set -u -o pipefail
          if gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=state:merged" >/dev/null 2>&1; then
            for label in state:implementing state:validating state:ready state:mergeable; do
              gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$label" >/dev/null 2>&1 || true
            done
          else
            echo "::warning::Merge succeeded but state:merged metadata could not be recorded."
          fi

  cleanup:
    name: Delete safe merged source branch best-effort
    needs: [gate, merge]
    if: needs.merge.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    steps:
      - name: Re-check branch identity before deletion
        shell: bash
        run: |
          set -u -o pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null) || {
            echo "::warning::Merged branch cleanup could not re-read PR; source branch preserved."
            exit 0
          }
          merged=$(jq -r '.merged' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")

          if [[ "$merged" != "true" || "$head_repo" != "$REPO" || "$head_ref" == "$base_ref" || "$head_ref" == "main" || -z "$head_ref" ]]; then
            exit 0
          fi

          encoded_ref=$(jq -rn --arg v "heads/$head_ref" '$v|@uri')
          if ! gh api --method DELETE "repos/$REPO/git/refs/$encoded_ref" >/dev/null 2>&1; then
            echo "::warning::Merged PR branch cleanup unavailable; branch preserved: $head_ref"
          fi
